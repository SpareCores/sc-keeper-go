# What keepertest/testdata/snapshot holds: one test region per vendor, the
# region, zone and benchmark tables, the on-demand (and spot) /servers listings
# and one /servers listing per benchmark. Refresh it with `make snapshot`
# (cmd/sc-snapshot; see package snapshot for the format).
vendors:
  # region is a region_id, api_reference or alias of /table/region (GCP and
  # Hetzner ids are numeric, hence the lookup).
  - {name: aws, region: us-east-1, spot: true}
  - {name: azure, region: westeurope, spot: true}
  - {name: gcp, region: us-central1, spot: true}
  - {name: alicloud, region: eu-central-1, spot: true}
  - {name: hcloud, region: fsn1}
  - {name: ovh, region: GRA11}
  - {name: upcloud, region: de-fra1}
  - {name: vultr, region: ewr}

# The benchmarks the tests select and rank on: single- and multi-core CPU, a
# composite profile and one lower-is-better metric. Configs are matched against
# /benchmark_configs by value; the canonical string is sent.
benchmarks:
  - {id: "geekbench:score", config: {cores: single}}
  - {id: "passmark:cpu_single_threaded_test"}
  - {id: "stress_ng:bestn"}
  - {id: "workload_profile:web"}
  - {id: "membench:latency", config: {scope: RAM}}

queries:
  - {name: tables/region, path: /table/region}
  - {name: tables/zone, path: /table/zone}
  - {name: benchmark_configs, path: /benchmark_configs}
  # An example of the anonymous /server_prices endpoint: AWS, two regions, both
  # allocations. Keeper embeds full server/vendor/region/zone objects in every
  # row (about 4 KB; 35,000 rows and 137 MB for four AWS regions), so the
  # fetcher stores a flat projection of the rows (manifest: projection "flat").
  # vcpus_min only keeps the committed file small; the replay server ignores
  # it, like every filter. (These two files were fetched later than the rest of
  # the snapshot; a full `make snapshot` makes them consistent.)
  - name: aws/server-prices-ondemand
    path: /server_prices
    params: {vendor: aws, vendor_regions: ["aws~us-east-1", "aws~us-west-2"], allocation: ondemand, vcpus_min: 128, limit: -1}
  - name: aws/server-prices-spot
    path: /server_prices
    params: {vendor: aws, vendor_regions: ["aws~us-east-1", "aws~us-west-2"], allocation: spot, vcpus_min: 128, limit: -1}

vendorQueries:
  - name: "{vendor}/servers-ondemand"
    path: /servers
    params:
      vendor: "{vendor}"
      vendor_regions: "{vendor}~{region_id}"
      limit: -1
      best_price_allocation: ONDEMAND_ONLY
  - name: "{vendor}/servers-spot"
    path: /servers
    requiresSpot: true
    params:
      vendor: "{vendor}"
      vendor_regions: "{vendor}~{region_id}"
      limit: -1
      best_price_allocation: SPOT_ONLY
  - name: "{vendor}/benchmark-{benchmark_slug}"
    path: /servers
    benchmarks: true
    params:
      vendor: "{vendor}"
      vendor_regions: "{vendor}~{region_id}"
      limit: -1
      best_price_allocation: ONDEMAND_ONLY
      benchmark_id: "{benchmark_id}"
      benchmark_config: "{benchmark_config}"
