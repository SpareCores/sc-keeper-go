name: Release

# A tag v0.x.y (v<semver>) publishes a GitHub release with generated notes
# after the gates pass on the tagged commit. Go consumers need nothing else:
# the module proxy serves the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/dev-image

      - name: Lint
        run: hack/dev.sh make lint

      - name: Test (offline)
        run: hack/dev.sh make test

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "${TAG}" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes "${prerelease[@]}"
